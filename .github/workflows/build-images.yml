name: Build and Push Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: build-images-main
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image names
        id: names
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')"
          echo "api=ghcr.io/${owner}/${repo}-api" >> "$GITHUB_OUTPUT"
          echo "lb=ghcr.io/${owner}/${repo}-lb" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.api }}:${{ steps.names.outputs.sha_tag }}
            ${{ steps.names.outputs.api }}:latest

      - name: Build and push load-balancer image
        uses: docker/build-push-action@v6
        with:
          context: apps/load-balancer
          file: apps/load-balancer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.lb }}:${{ steps.names.outputs.sha_tag }}
            ${{ steps.names.outputs.lb }}:latest
