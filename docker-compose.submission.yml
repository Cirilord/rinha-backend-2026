services:
  api1:
    image: __API_IMAGE__
    environment:
      UNIX_SOCKET_PATH: "/shared/api1.sock"
      X_SCORE_INDEX_PATH: "/app/resources/references.idx"
    volumes:
      - shared-sockets:/shared
    logging:
      driver: none
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"

  api2:
    image: __API_IMAGE__
    environment:
      UNIX_SOCKET_PATH: "/shared/api2.sock"
      X_SCORE_INDEX_PATH: "/app/resources/references.idx"
    volumes:
      - shared-sockets:/shared
    logging:
      driver: none
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "150MB"

  load-balancer:
    image: __LB_IMAGE__
    ports:
      - "9999:9999"
    environment:
      PORT: "9999"
      WORKER_SOCKETS: "/shared/api1.sock,/shared/api2.sock"
    volumes:
      - shared-sockets:/shared
    logging:
      driver: none
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - api1
      - api2
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "50MB"

networks:
  rinha:
    driver: bridge

volumes:
  shared-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,uid=0,gid=0,mode=0777"
