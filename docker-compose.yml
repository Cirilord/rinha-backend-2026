services:
  api1:
    image: ghcr.io/cirilord/rinha-backend-2026-api:sha-16f59107f6c2edd990dfaf7dede2a07a72a89838
    platform: linux/amd64
    environment:
      UNIX_SOCKET_PATH: "/shared/api1.sock"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpuset: "1"
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.41"
          memory: "150MB"

  api2:
    image: ghcr.io/cirilord/rinha-backend-2026-api:sha-16f59107f6c2edd990dfaf7dede2a07a72a89838
    platform: linux/amd64
    environment:
      UNIX_SOCKET_PATH: "/shared/api2.sock"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpuset: "2"
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.41"
          memory: "150MB"

  load-balancer:
    image: ghcr.io/cirilord/rinha-backend-2026-lb:sha-16f59107f6c2edd990dfaf7dede2a07a72a89838
    platform: linux/amd64
    ports:
      - "9999:9999"
    environment:
      PORT: "9999"
      WORKER_SOCKETS: "/shared/api1.sock,/shared/api2.sock"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpuset: "0"
    depends_on:
      - api1
      - api2
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.18"
          memory: "50MB"

networks:
  rinha:
    driver: bridge

volumes:
  shared-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,mode=0777
