name: rinha-backend

services:
  load-balancer:
    build:
      context: .
      dockerfile: apps/load-balancer/Dockerfile
    container_name: load-balancer
    depends_on:
      - api1
      - api2
    ports:
      - "9999:9999"
    cpus: 0.12
    mem_limit: 20m
    environment:
      UPSTREAM_SOCKETS: "/tmp/server-1.sock,/tmp/server-2.sock"
    logging:
      driver: none
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - sockets:/tmp
    networks:
      - rinha

  api1:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["/tmp/server-1.sock"]
    cpus: 0.44
    mem_limit: 165m
    environment:
      CONN_POOL_CAP: "512"
      EPOLL_SPIN_US: "0"
      EPOLL_IDLE_US: "60"
      EPOLL_BUSY_POLL_US: "150"
      EPOLL_BUSY_POLL_BUDGET: "8"
      EPOLL_PREFER_BUSY_POLL: "1"
    logging:
      driver: none
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    volumes:
      - sockets:/tmp
    networks:
      - rinha

  api2:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    command: ["/tmp/server-2.sock"]
    cpus: 0.44
    mem_limit: 165m
    environment:
      CONN_POOL_CAP: "512"
      EPOLL_SPIN_US: "0"
      EPOLL_IDLE_US: "60"
      EPOLL_BUSY_POLL_US: "150"
      EPOLL_BUSY_POLL_BUDGET: "8"
      EPOLL_PREFER_BUSY_POLL: "1"
    logging:
      driver: none
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    volumes:
      - sockets:/tmp
    networks:
      - rinha

volumes:
  sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,uid=0,gid=0,mode=0777"

networks:
  rinha:
    driver: bridge
