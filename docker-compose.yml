services:
  api1:
    image: ghcr.io/cirilord/rinha-backend-2026-api:sha-5e09a4385ab39129deb43b67c6b1d3d0e30fb296
    environment:
      UNIX_SOCKET_PATH: "/shared/api1.sock"
      X_SCORE_INDEX_PATH: "/app/resources/references.idx"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.439"
          memory: "100MB"

  api2:
    image: ghcr.io/cirilord/rinha-backend-2026-api:sha-5e09a4385ab39129deb43b67c6b1d3d0e30fb296
    environment:
      UNIX_SOCKET_PATH: "/shared/api2.sock"
      X_SCORE_INDEX_PATH: "/app/resources/references.idx"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.439"
          memory: "100MB"

  load-balancer:
    image: ghcr.io/cirilord/rinha-backend-2026-lb:sha-5e09a4385ab39129deb43b67c6b1d3d0e30fb296
    ports:
      - "9999:9999"
    environment:
      PORT: "9999"
      WORKER_SOCKETS: "/shared/api1.sock,/shared/api2.sock"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - api1
      - api2
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.120"
          memory: "50MB"

networks:
  rinha:
    driver: bridge

volumes:
  shared-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
