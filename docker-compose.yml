services:
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: api1
    environment:
      PORT: '9999'
      WORKERS: '4'
      NPROBE: '10'
      KNN_K: '5'
      FRAUD_THRESHOLD: '57'
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.40"
    #       memory: "130MB"
    networks:
      - rinha-net

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: api2
    environment:
      PORT: '9999'
      WORKERS: '4'
      NPROBE: '10'
      KNN_K: '5'
      FRAUD_THRESHOLD: '57'
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.40"
    #       memory: "130MB"
    networks:
      - rinha-net

  nginx:
    image: nginx:alpine
    ports:
      - '9999:9999'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.20"
    #       memory: "90MB"
    networks:
      - rinha-net

networks:
  rinha-net:
    driver: bridge
