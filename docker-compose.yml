services:
  api1:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    environment:
      UNIX_SOCKET_PATH: "/shared/api1.sock"
      X_SCORE_INDEX_PATH: "/app/resources/references.idx"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.44"
          memory: "150MB"

  api2:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    environment:
      UNIX_SOCKET_PATH: "/shared/api2.sock"
      X_SCORE_INDEX_PATH: "/app/resources/references.idx"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.44"
          memory: "150MB"

  load-balancer:
    build:
      context: .
      dockerfile: ./apps/load-balancer/Dockerfile
    ports:
      - "9999:9999"
    environment:
      PORT: "9999"
      WORKER_SOCKETS: "/shared/api1.sock,/shared/api2.sock"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - api1
      - api2
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.12"
          memory: "50MB"

networks:
  rinha:
    driver: bridge

volumes:
  shared-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
