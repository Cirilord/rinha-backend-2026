services:
  api1:
    image: ghcr.io/cirilord/rinha-backend-2026-api:sha-2910da7a085e8c06c418bc0d55eb76a0f6992cd1
    platform: linux/amd64
    environment:
      UNIX_SOCKET_PATH: "/shared/api1.sock"
      X_SCORE_INDEX_PATH: "/app/resources/references.idx"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpuset: "1"
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "144MB"

  api2:
    image: ghcr.io/cirilord/rinha-backend-2026-api:sha-2910da7a085e8c06c418bc0d55eb76a0f6992cd1
    platform: linux/amd64
    environment:
      UNIX_SOCKET_PATH: "/shared/api2.sock"
      X_SCORE_INDEX_PATH: "/app/resources/references.idx"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpuset: "2"
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "144MB"

  load-balancer:
    image: ghcr.io/cirilord/rinha-backend-2026-lb:sha-2910da7a085e8c06c418bc0d55eb76a0f6992cd1
    platform: linux/amd64
    ports:
      - "9999:9999"
    environment:
      PORT: "9999"
      WORKER_SOCKETS: "/shared/api1.sock,/shared/api2.sock"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cpuset: "0"
    depends_on:
      - api1
      - api2
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.18"
          memory: "50MB"

  warmup:
    image: curlimages/curl:8.8.0
    platform: linux/amd64
    profiles:
      - warmup
    entrypoint: ["/bin/sh", "/warmup.sh"]
    environment:
      BASE_URL: "http://load-balancer:9999"
      READY_RETRIES: "240"
      READY_SLEEP: "0.25"
      WARMUP_ROUNDS: "48"
    volumes:
      - ./scripts/warmup.sh:/warmup.sh:ro
    depends_on:
      - load-balancer
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.02"
          memory: "12MB"
    restart: "no"

networks:
  rinha:
    driver: bridge

volumes:
  shared-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=4m,mode=0777
