  main2-1:
    image: ghcr.io/cirilord/rinha-backend-2026-api:sha-3c1bc2bc15a8f3af025378c2286ddf013473ec87
    environment:
      UNIX_SOCKET_PATH: "/shared/main2-1.sock"
      X_SCORE_INDEX_PATH: "/app/resources/references.idx"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.44"
          memory: "150MB"

  main2-2:
    image: ghcr.io/cirilord/rinha-backend-2026-api:sha-3c1bc2bc15a8f3af025378c2286ddf013473ec87
    environment:
      UNIX_SOCKET_PATH: "/shared/main2-2.sock"
      X_SCORE_INDEX_PATH: "/app/resources/references.idx"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.44"
          memory: "150MB"

  lb2:
    image: ghcr.io/cirilord/rinha-backend-2026-lb:sha-3c1bc2bc15a8f3af025378c2286ddf013473ec87
    ports:
      - "9999:9999"
    environment:
      PORT: "9999"
      WORKER_SOCKETS: "/shared/main2-1.sock,/shared/main2-2.sock"
    volumes:
      - shared-sockets:/shared
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - main2-1
      - main2-2
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.12"
          memory: "50MB"

networks:
  rinha:
    driver: bridge

volumes:
  shared-sockets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
