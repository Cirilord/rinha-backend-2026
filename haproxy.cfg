global
  maxconn 50000
  log stdout format raw local0

defaults
  mode http
  option dontlognull
  option http-keep-alive
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  timeout http-keep-alive 30s

frontend fe_http
  bind *:9999
  default_backend be_api

backend be_api
  balance roundrobin
  http-request set-header X-Pathname %[path]
  http-request del-header Connection
  server api1 api1:9999 check
  server api2 api2:9999 check
